name: probe
on: { workflow_dispatch: {}, push: { paths: ['.github/workflows/probe.yml'] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env: { UA: "${{ secrets.SEC_USER_AGENT }}" }
        run: |
          U=$(echo "$UA" | tr -s '[:space:]' ' ' | sed 's/ *$//')
          E=$(echo "$U" | grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+')
          for ua in "$U" "Taeheon Research $E" "Taeheon Research test.alphadesk@gmail.com" "Sample Company Name AdminContact@samplecompany.com"; do
            c1=$(curl -s -o /dev/null -w "%{http_code}" -A "$ua" -H "Accept-Encoding: gzip, deflate" https://www.sec.gov/files/company_tickers.json)
            c2=$(curl -s -o /dev/null -w "%{http_code}" -A "$ua" -H "Accept-Encoding: gzip, deflate" https://data.sec.gov/submissions/CIK0000320193.json)
            d=$(echo "$ua" | grep -oE '@[A-Za-z0-9.-]+'); echo "RESULT www=$c1 data=$c2 domain=$d words=$(echo $ua | wc -w)"
          done
          python3 -c "
          import requests,os,re
          u=' '.join(os.environ['UA'].split()); e=re.findall(r'[\w.+-]+@[\w.-]+',u)[0]
          for ua in [u,'Taeheon Research '+e,'Taeheon Research test.alphadesk@gmail.com']:
            r=requests.get('https://www.sec.gov/files/company_tickers.json',headers={'User-Agent':ua,'Accept-Encoding':'gzip, deflate'}); print('PYRESULT',r.status_code,ua.split('@')[-1])
          "
