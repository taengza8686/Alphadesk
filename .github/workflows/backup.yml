name: AlphaDesk 데이터 백업

on:
  schedule:
    - cron: "23 */4 * * *"   # 4시간마다 (한국시간 01:23, 05:23, 09:23, 13:23, 17:23, 21:23)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: alphadesk-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 백업 저장소 연결 확인
        env:
          T: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "BACKUP_REPO_TOKEN 이 없습니다 → 백업 건너뜀"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Alphadesk-backup
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Cloudflare → 백업 폴더
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          python tools/backup.py backup
      - name: 백업 저장소에 저장 (바뀐 것만)
        run: |
          cd backup
          git config user.name "AlphaDesk Backup"
          git config user.email "taengza8686@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -q -m "백업 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST · $(python3 -c "import json;m=json.load(open('manifest.json'));print(f\"페이지 {m['pages_alive']} · 파일 {m['files']} · 회원/포트폴리오 {m['kv_keys']}\")")"
          git push -q
          echo "백업 저장 완료"
