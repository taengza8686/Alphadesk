name: Cloudflare KV setup (portfolio storage)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  kv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find or create KV namespace
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          echo "--- list"
          npx --yes wrangler@4 kv namespace list > ns.json 2> err.txt || { echo "LIST_FAILED"; cat err.txt | tail -20; exit 0; }
          cat ns.json | head -c 2000; echo
          ID=$(jq -r '.[] | select(.title=="alphadesk-pf") | .id' ns.json | head -1)
          if [ -z "$ID" ]; then
            echo "--- create"
            npx --yes wrangler@4 kv namespace create alphadesk-pf 2>&1 | tail -20 || echo "CREATE_FAILED"
          else
            echo "KV_ID=$ID"
          fi
