name: probe FRED reachability
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in "https://fred.stlouisfed.org/graph/fredgraph.csv?id=BAMLH0A0HYM2" "https://api.stlouisfed.org/fred/series/observations?series_id=BAMLH0A0HYM2&file_type=json" "https://fred.stlouisfed.org/series/BAMLH0A0HYM2"; do
            echo "== $u"; curl -s -o /tmp/o -w "code=%{http_code} time=%{time_total}\n" -m 40 -A "Mozilla/5.0 AlphaDesk" "$u" || echo "curl failed"; head -c 200 /tmp/o; echo; done
