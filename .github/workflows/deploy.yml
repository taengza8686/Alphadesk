name: Build & deploy AlphaDesk

on:
  schedule:
    # 평일 22:17 UTC = 미국 장 마감 후 (한국시간 다음날 07:17)
    - cron: "17 22 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/yinfo
            .cache/sub
            .cache/holdings_IWB.json
            .cache/holdings_IWM.json
            .cache/company_tickers.json
            .cache/sp500.json
            .cache/tr_ko.json
          key: alphadesk-${{ github.run_id }}
          restore-keys: alphadesk-
      - name: Build data (Russell 1000)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || format('AlphaDesk {0}@users.noreply.github.com', github.repository_owner) }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || secrets.FINHUB_API_KEY || secrets.FINNHUB_KEY || secrets.FINNHUB || vars.FINNHUB_API_KEY || vars.FINHUB_API_KEY || vars.FINNHUB_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build_data.py --out-dir site/data --info-budget 300
      - name: Mirror to Cloudflare Pages (github 없는 주소)
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PF_PASSWORD: ${{ secrets.PF_PASSWORD }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare 비밀값 없음 → 미러 배포 건너뜀"; exit 0
          fi
          echo "Cloudflare 비밀값: 설정됨"
          npx --yes wrangler@4 pages project create alphadesk --production-branch main \
            || echo "프로젝트가 이미 있거나 생성 실패(아래 배포에서 확인)"
          # 포트폴리오 서버 저장: KV 저장소 찾기/만들기 → 연결 (토큰에 KV 권한이 없으면 건너뜀)
          rm -f wrangler.toml
          KV_ID=""
          if npx --yes wrangler@4 kv namespace list > ns.json 2>/dev/null; then
            KV_ID=$(jq -r '.[] | select(.title=="alphadesk-pf") | .id' ns.json | head -1)
            if [ -z "$KV_ID" ]; then
              npx --yes wrangler@4 kv namespace create alphadesk-pf > kvc.txt 2>&1 || true
              npx --yes wrangler@4 kv namespace list > ns.json 2>/dev/null || true
              KV_ID=$(jq -r '.[] | select(.title=="alphadesk-pf") | .id' ns.json | head -1)
            fi
          else
            echo "포트폴리오 서버 저장: 토큰에 Workers KV 권한 없음 → 건너뜀"
          fi
          if [ -n "$KV_ID" ]; then
            printf 'name = "alphadesk"\npages_build_output_dir = "site"\ncompatibility_date = "2026-11-01"\n\n[[kv_namespaces]]\nbinding = "PF_KV"\nid = "%s"\n' "$KV_ID" > wrangler.toml
            echo "포트폴리오 서버 저장: KV 연결됨"
          fi
          if [ -n "$PF_PASSWORD" ]; then
            printf '%s' "$PF_PASSWORD" | npx --yes wrangler@4 pages secret put PF_PASSWORD --project-name alphadesk > /dev/null 2>&1 \
              && echo "포트폴리오 서버 저장: 비밀번호 설정됨" || echo "포트폴리오 서버 저장: 비밀번호 설정 실패"
          else
            echo "포트폴리오 서버 저장: GitHub 비밀값 PF_PASSWORD 없음"
          fi
          npx --yes wrangler@4 pages deploy site --project-name alphadesk --branch main --commit-dirty=true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
